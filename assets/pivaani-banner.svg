<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5426" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF5426" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for 3D Shading -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FF8E3C"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="100%" stop-color="#0E1118"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D3548"/>
      <stop offset="100%" stop-color="#404B67"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#090B0F"/>
    </linearGradient>
    <linearGradient id="ringLedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 16px #00F5D4); }
      }
      @keyframes float3D {
        0%, 100% { transform: translateY(0px) rotateX(15deg) rotateY(-20deg); }
        50% { transform: translateY(-14px) rotateX(18deg) rotateY(-16deg); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.4; }
        100% { transform: translateY(400px); opacity: 0; }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(120px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(120px) rotate(-360deg); }
      }
      .soundbox-3d {
        transform-origin: 880px 210px;
        animation: float3D 6s ease-in-out infinite;
      }
      .ring-led {
        transform-origin: 880px 200px;
        animation: pulseRing 3s ease-in-out infinite;
      }
      .grid-line { stroke: rgba(148, 163, 184, 0.08); stroke-width: 1; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGlow)"/>

  <!-- Perspective 3D Grid on Ground -->
  <g opacity="0.35">
    <path d="M 0 320 L 1200 320" stroke="#00F5D4" stroke-width="0.8" opacity="0.3"/>
    <path d="M 0 350 L 1200 350" stroke="#00F5D4" stroke-width="1.2" opacity="0.5"/>
    <path d="M 0 390 L 1200 390" stroke="#00F5D4" stroke-width="1.8" opacity="0.8"/>
    <!-- Vanishing perspective lines -->
    <path d="M 600 200 L 0 420" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <path d="M 600 200 L 200 420" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <path d="M 600 200 L 400 420" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <path d="M 600 200 L 600 420" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <path d="M 600 200 L 800 420" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <path d="M 600 200 L 1000 420" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <path d="M 600 200 L 1200 420" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Glowing Ambient Orbs -->
  <circle cx="880" cy="210" r="180" fill="url(#orangeGlow)"/>
  <circle cx="280" cy="180" r="220" fill="url(#cyanGlow)"/>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 65)">
      <rect width="280" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="5" fill="#10B981" filter="url(#softGlow)"/>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">
        BHAROSA LAYER FOR UPI 2.0
      </text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 155)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">
        Pi Vaani
      </text>
      <!-- Sub-tag glowing orange -->
      <text x="270" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="url(#fireGrad)" filter="url(#softGlow)" letter-spacing="1">
        · TRUST PROTOCOL
      </text>
      <!-- Subtitle -->
      <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#38BDF8" letter-spacing="0.2">
        Deterministic Voice Soundbox &amp; 7-Gate Safety Firewall
      </text>
      <text y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#64748B">
        Zero Retap Ambiguity · Dual-Channel Cryptographic Hash Chain · In-Flight Distributed Locks
      </text>
    </g>

    <!-- Stat Badges Cards -->
    <g transform="translate(0, 275)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="140" height="64" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#10B981">7 GATES</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">Deterministic Eval</text>

      <!-- Card 2 -->
      <rect x="155" y="0" width="140" height="64" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
      <text x="171" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#38BDF8">&lt; 10ms</text>
      <text x="171" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">Double-Spend Lock</text>

      <!-- Card 3 -->
      <rect x="310" y="0" width="150" height="64" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
      <text x="326" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#F59E0B">SHA-256</text>
      <text x="326" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">Tamper-Proof Audit</text>

      <!-- Card 4 -->
      <rect x="475" y="0" width="150" height="64" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
      <text x="491" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#EC4899">NetworkX</text>
      <text x="491" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">Fraud Graph Collusion</text>
    </g>
  </g>

  <!-- Right Side: 3D Isometric Soundbox Floating Unit -->
  <g class="soundbox-3d">
    <!-- Drop Shadow -->
    <ellipse cx="880" cy="335" rx="110" ry="24" fill="#000000" opacity="0.65" filter="url(#neonBlur)"/>

    <!-- 3D Soundbox Body -->
    <!-- Top Face (Isometric rhombus) -->
    <polygon points="880,100 970,145 880,175 790,130" fill="url(#boxTop)" stroke="#475569" stroke-width="1"/>
    
    <!-- Left Face -->
    <polygon points="790,130 880,175 880,295 790,245" fill="url(#boxSide)" stroke="#1E293B" stroke-width="1"/>

    <!-- Right Front Face -->
    <polygon points="880,175 970,145 970,265 880,295" fill="url(#boxFront)" stroke="#334155" stroke-width="1.2"/>

    <!-- Dynamic Ring LED Speaker Grille on Front Face -->
    <g transform="translate(925, 215) skewY(-18)">
      <!-- Outer Speaker Bezel -->
      <ellipse cx="0" cy="0" rx="34" ry="48" fill="#0B0F17" stroke="#1E293B" stroke-width="3"/>
      <!-- Glowing Animated Ring LED -->
      <ellipse cx="0" cy="0" rx="28" ry="40" fill="none" stroke="url(#ringLedGrad)" stroke-width="5" filter="url(#softGlow)" class="ring-led"/>
      <!-- Inner Speaker Mesh -->
      <ellipse cx="0" cy="0" rx="18" ry="26" fill="#030712" stroke="#374151" stroke-width="1"/>
      <circle cx="0" cy="0" r="6" fill="#10B981" filter="url(#softGlow)"/>
    </g>

    <!-- Top Touch Panel & Mic Array -->
    <g transform="translate(880, 137) skewX(-45) rotate(15)">
      <circle cx="-16" cy="0" r="3" fill="#64748B"/>
      <circle cx="0" cy="0" r="4.5" fill="#EF4444" filter="url(#softGlow)"/>
      <circle cx="16" cy="0" r="3" fill="#64748B"/>
    </g>

    <!-- Holographic Floating UPI Shield Symbol -->
    <g transform="translate(880, 80)" filter="url(#neonBlur)">
      <path d="M 0 -25 L 22 -14 L 22 10 Q 22 26 0 35 Q -22 26 -22 10 L -22 -14 Z" fill="none" stroke="#00F5D4" stroke-width="2.5" opacity="0.9"/>
      <path d="M -8 2 L -2 8 L 10 -4" fill="none" stroke="#00F5D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Sound Waves Emanating -->
    <g opacity="0.6" stroke="#00F5D4" stroke-width="1.5" fill="none" filter="url(#softGlow)">
      <path d="M 985 180 Q 1025 210 985 240"/>
      <path d="M 1005 165 Q 1055 210 1005 255" stroke-dasharray="3 3"/>
      <path d="M 1025 150 Q 1085 210 1025 270"/>
    </g>

    <!-- Live Status Label Under Soundbox -->
    <g transform="translate(880, 370)">
      <rect x="-90" y="-12" width="180" height="24" rx="12" fill="#0B132B" stroke="#00F5D4" stroke-width="1"/>
      <circle cx="-70" cy="0" r="4" fill="#00F5D4" filter="url(#softGlow)"/>
      <text x="-56" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">
        SOUNDBOX · ONLINE
      </text>
    </g>
  </g>
</svg>

