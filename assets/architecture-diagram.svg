<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF5426"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="860" rx="20" fill="#F8FAFC"/>

  <text x="40" y="52" font-size="24" font-weight="800" fill="#0F172A">Pi Vaani · System Architecture</text>
  <text x="40" y="78" font-size="14" fill="#64748B">The recommender proposes, the 7-gate firewall decides, and only one function ever moves money.</text>

  <!-- ===================== FRONTEND ===================== -->
  <rect x="40" y="104" width="1120" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="60" y="130" font-size="12" font-weight="800" fill="#FF5426" letter-spacing="1.5">FRONTEND · NEXT.JS 16 · REACT 19 · /demo</text>

  <g>
    <rect x="60" y="146" width="250" height="90" rx="12" fill="#FFF7F3" stroke="#FDBA9F"/>
    <text x="78" y="172" font-size="15" font-weight="700" fill="#0F172A">📱 Customer Phone</text>
    <text x="78" y="194" font-size="12" fill="#475569">Pay / retap · case-lock banner</text>
    <text x="78" y="213" font-size="12" fill="#475569">Bharosa receipt (Hindi)</text>
  </g>
  <g>
    <rect x="330" y="146" width="250" height="90" rx="12" fill="#FFF7F3" stroke="#FDBA9F"/>
    <text x="348" y="172" font-size="15" font-weight="700" fill="#0F172A">🔊 UPI Soundbox</text>
    <text x="348" y="194" font-size="12" fill="#475569">Queued voice playback, one tab only</text>
    <text x="348" y="213" font-size="12" fill="#475569">Hold-to-talk mic → WAV → STT</text>
  </g>
  <g>
    <rect x="600" y="146" width="250" height="90" rx="12" fill="#FFF7F3" stroke="#FDBA9F"/>
    <text x="618" y="172" font-size="15" font-weight="700" fill="#0F172A">🏪 Merchant Panel</text>
    <text x="618" y="194" font-size="12" fill="#475569">Trust dial · case card · PIN approve</text>
    <text x="618" y="213" font-size="12" fill="#475569">Live 7-gate sweep animation</text>
  </g>
  <g>
    <rect x="870" y="146" width="270" height="90" rx="12" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="888" y="172" font-size="15" font-weight="700" fill="#0F172A">🧪 Scenario Drawer + Audit</text>
    <text x="888" y="194" font-size="12" fill="#475569">Bank webhooks · 6 attacks</text>
    <text x="888" y="213" font-size="12" fill="#475569">Audit terminal · Verify integrity</text>
  </g>

  <!-- transport arrows -->
  <line x1="330" y1="258" x2="330" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="272" width="128" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="254" y="289" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">REST commands</text>

  <line x1="870" y1="318" x2="870" y2="258" stroke="#FF5426" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="882" y="272" width="250" height="24" rx="12" fill="#FFF1EC" stroke="#FDBA9F"/>
  <text x="1007" y="289" font-size="12" font-weight="700" fill="#C2360F" text-anchor="middle">WebSocket events (unique event_id)</text>

  <!-- ===================== BACKEND ===================== -->
  <rect x="40" y="320" width="1120" height="370" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="60" y="346" font-size="12" font-weight="800" fill="#0F766E" letter-spacing="1.5">BACKEND · FASTAPI · PYTHON 3.10+</text>

  <!-- routers -->
  <rect x="60" y="362" width="230" height="140" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="78" y="388" font-size="15" font-weight="700" fill="#0F172A">API routers</text>
  <text x="78" y="410" font-size="12" fill="#475569">/api/sandbox/pay (idempotent)</text>
  <text x="78" y="428" font-size="12" fill="#475569">/api/sandbox/payments/{id}/state</text>
  <text x="78" y="446" font-size="12" fill="#475569">/api/approval/challenge · /approval</text>
  <text x="78" y="464" font-size="12" fill="#475569">/api/attack/{kind}</text>
  <text x="78" y="482" font-size="12" fill="#475569">/api/voice/stt · /api/audit/verify</text>

  <!-- case engine -->
  <rect x="310" y="362" width="250" height="140" rx="12" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="328" y="388" font-size="15" font-weight="700" fill="#0F172A">⚙️ Case Engine (cases.py)</text>
  <text x="328" y="410" font-size="12" fill="#475569">1 s monitor: PENDING &gt; 2 s → case</text>
  <text x="328" y="428" font-size="12" fill="#475569">Resolution ladder:</text>
  <text x="328" y="446" font-size="12" fill="#475569">HOLD → NEEDS_APPROVAL → ALLOW</text>
  <text x="328" y="464" font-size="12" fill="#475569">Receipts · reconciliation alerts</text>
  <text x="328" y="482" font-size="12" fill="#475569">Hindi + Tamil announcements</text>

  <!-- recommender -->
  <rect x="580" y="362" width="200" height="140" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="6 4"/>
  <text x="598" y="388" font-size="15" font-weight="700" fill="#0F172A">🧠 Recommender</text>
  <text x="598" y="410" font-size="12" fill="#475569">Proposes {action, amount,</text>
  <text x="598" y="428" font-size="12" fill="#475569">confidence}. Rules today,</text>
  <text x="598" y="446" font-size="12" fill="#475569">LLM-pluggable.</text>
  <text x="598" y="474" font-size="12" font-weight="700" fill="#B45309">Treated as UNTRUSTED</text>

  <!-- firewall -->
  <rect x="800" y="362" width="340" height="140" rx="12" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="818" y="388" font-size="15" font-weight="700" fill="#0F172A">🛡️ 7-Gate Firewall (firewall.py)</text>
  <g font-size="11" font-weight="700" fill="#065F46">
    <rect x="818" y="402" width="92" height="24" rx="6" fill="#D1FAE5"/><text x="864" y="418" text-anchor="middle">1 Authority</text>
    <rect x="916" y="402" width="92" height="24" rx="6" fill="#D1FAE5"/><text x="962" y="418" text-anchor="middle">2 Amount</text>
    <rect x="1014" y="402" width="108" height="24" rx="6" fill="#D1FAE5"/><text x="1068" y="418" text-anchor="middle">3 Confidence</text>
    <rect x="818" y="432" width="92" height="24" rx="6" fill="#D1FAE5"/><text x="864" y="448" text-anchor="middle">4 Identity</text>
    <rect x="916" y="432" width="92" height="24" rx="6" fill="#D1FAE5"/><text x="962" y="448" text-anchor="middle">5 Idempotency</text>
    <rect x="1014" y="432" width="108" height="24" rx="6" fill="#D1FAE5"/><text x="1068" y="448" text-anchor="middle">6 Reversibility</text>
    <rect x="818" y="462" width="92" height="24" rx="6" fill="#D1FAE5"/><text x="864" y="478" text-anchor="middle">7 Approval</text>
  </g>
  <text x="920" y="479" font-size="11" font-weight="700" fill="#0F172A">→ ALLOW · APPROVAL · HOLD · BLOCK</text>

  <!-- flow arrows -->
  <line x1="290" y1="432" x2="308" y2="432" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="432" x2="578" y2="432" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="432" x2="798" y2="432" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- second row -->
  <rect x="60" y="522" width="230" height="150" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="78" y="548" font-size="15" font-weight="700" fill="#0F172A">🔐 security.py · locks.py</text>
  <text x="78" y="570" font-size="12" fill="#475569">PBKDF2 hashed merchant PIN</text>
  <text x="78" y="588" font-size="12" fill="#475569">Single-use 60 s approval nonces</text>
  <text x="78" y="606" font-size="12" fill="#475569">3 wrong PINs → case locked</text>
  <text x="78" y="624" font-size="12" fill="#475569">Per-key async locks: payer +</text>
  <text x="78" y="642" font-size="12" fill="#475569">merchant + amount</text>

  <rect x="310" y="522" width="250" height="150" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="328" y="548" font-size="15" font-weight="700" fill="#0F172A">🕸️ Fraud graph (NetworkX)</text>
  <text x="328" y="570" font-size="12" fill="#475569">Customer ↔ merchant edges per</text>
  <text x="328" y="588" font-size="12" fill="#475569">stuck payment, 5-min window</text>
  <text x="328" y="606" font-size="12" fill="#475569">&gt; 3 merchants → flagged</text>
  <text x="328" y="624" font-size="12" fill="#475569">Flagged → Identity REVIEW</text>
  <text x="328" y="642" font-size="12" fill="#475569">(manual review, not a ban)</text>

  <rect x="580" y="522" width="200" height="150" rx="12" fill="#FFF7F3" stroke="#FDBA9F"/>
  <text x="598" y="548" font-size="15" font-weight="700" fill="#0F172A">📣 Event bus</text>
  <text x="598" y="570" font-size="12" fill="#475569">asyncio.Queue: publishers</text>
  <text x="598" y="588" font-size="12" fill="#475569">never block on clients</text>
  <text x="598" y="606" font-size="12" fill="#475569">One dispatcher → all</text>
  <text x="598" y="624" font-size="12" fill="#475569">WebSockets, in order</text>

  <rect x="800" y="522" width="340" height="150" rx="12" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="818" y="548" font-size="15" font-weight="700" fill="#0F172A">💸 execute_refund()</text>
  <text x="818" y="570" font-size="12" fill="#475569">The only code path that moves money.</text>
  <text x="818" y="588" font-size="12" fill="#475569">Reached only on an ALLOW decision.</text>
  <text x="818" y="606" font-size="12" fill="#475569">Payment → REFUNDED · case → RESOLVED</text>
  <text x="818" y="624" font-size="12" fill="#475569">Receipts + voice in customer &amp; merchant</text>
  <text x="818" y="642" font-size="12" fill="#475569">languages</text>
  <line x1="970" y1="504" x2="970" y2="520" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ===================== DATA + EXTERNAL ===================== -->
  <rect x="40" y="712" width="660" height="124" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="60" y="738" font-size="12" font-weight="800" fill="#1D4ED8" letter-spacing="1.5">STORAGE · SQLITE + SQLALCHEMY</text>
  <rect x="60" y="752" width="280" height="68" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="76" y="776" font-size="14" font-weight="700" fill="#0F172A">merchants · policies · payments</text>
  <text x="76" y="798" font-size="12" fill="#475569">cases · actions</text>
  <rect x="356" y="752" width="324" height="68" rx="10" fill="#0F172A"/>
  <text x="372" y="776" font-size="14" font-weight="700" fill="#F8FAFC">📜 audit_events: SHA-256 hash chain</text>
  <text x="372" y="798" font-size="12" fill="#94A3B8">Append-only DB triggers · HMAC-signed head</text>

  <rect x="720" y="712" width="440" height="124" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="740" y="738" font-size="12" font-weight="800" fill="#7C3AED" letter-spacing="1.5">EXTERNAL · SARVAM AI</text>
  <rect x="740" y="752" width="400" height="68" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="756" y="776" font-size="14" font-weight="700" fill="#0F172A">Bulbul TTS (hi / ta / en) · Saarika STT</text>
  <text x="756" y="798" font-size="12" fill="#475569">Cached MP3s · browser speech fallback when offline</text>

  <line x1="400" y1="692" x2="400" y2="710" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="692" x2="940" y2="710" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
